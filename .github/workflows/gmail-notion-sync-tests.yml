name: Boundless outbound sync tests
on:
  pull_request:
    paths:
      - "ops/gmail-notion-sync/**"
      - ".github/workflows/gmail-notion-sync-tests.yml"
  push:
    branches:
      - "feat/durable-gmail-notion-sync"
    paths:
      - "ops/gmail-notion-sync/**"
permissions:
  contents: read
jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run pure unit tests
        run: node --test ops/gmail-notion-sync/src/worker.test.mjs
