name: Gmail Notion Sync CI

on:
  pull_request:
    paths:
      - "workers/gmail-notion-sync/**"
      - ".github/workflows/gmail-notion-sync-ci.yml"
  push:
    branches:
      - "feature/gmail-notion-sync-v0-1"
    paths:
      - "workers/gmail-notion-sync/**"
      - ".github/workflows/gmail-notion-sync-ci.yml"

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/gmail-notion-sync

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: npm install

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=moderate

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Commit generated lockfile once
        if: github.event_name == 'push' && github.ref == 'refs/heads/feature/gmail-notion-sync-v0-1'
        working-directory: .
        run: |
          if git ls-files --error-unmatch workers/gmail-notion-sync/package-lock.json >/dev/null 2>&1; then
            echo "package-lock.json is already tracked; no bootstrap commit needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add workers/gmail-notion-sync/package-lock.json
          git commit -m "Lock Gmail-Notion sync worker dependencies"
          git push origin HEAD:feature/gmail-notion-sync-v0-1
